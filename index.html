<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Generator Crew</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .wrap {
      max-width: 1050px;
      margin: auto;
      padding: 28px 18px;
    }

    .hero {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      padding: 30px;
      border-radius: 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-top: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0000000d;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }

    .hint {
      color: #64748b;
      font-size: 12px;
      margin-top: 5px;
    }

    .actions {
      margin-top: 20px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      margin-left: 8px;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      display: none;
      padding: 13px;
      margin-top: 16px;
      border-radius: 9px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status.ok {
      background: #f0fdf4;
      color: #166534;
    }

    .result {
      white-space: pre-wrap;
      background: #0f172a;
      color: white;
      padding: 16px;
      border-radius: 10px;
      overflow: auto;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <section class="hero">
      <h1>Quiz Generator Crew</h1>
      <p>Generate quizzes using your CrewAI workflow.</p>
    </section>

    <section class="card">

      <h2>Run Your Quiz Workflow</h2>

      <form id="quizForm">

        <div class="grid">

          <div>
            <label for="pdfLink">Study Material PDF Link</label>

            <input
              id="pdfLink"
              name="pdfLink"
              type="url"
              placeholder="Paste Google Drive PDF link"
              required
            />

            <div class="hint">
              Paste your Google Drive sharing link.
            </div>
          </div>

          <div>
            <label for="title">Quiz Title</label>

            <input
              id="title"
              type="text"
              placeholder="Enter quiz title"
              required
            />
          </div>

          <div>
            <label for="recipientName">Recipient Name</label>

            <input
              id="recipientName"
              type="text"
              placeholder="Enter recipient name"
              required
            />
          </div>

          <div>
            <label for="recipient">Recipient Email</label>

            <input
              id="recipient"
              type="email"
              placeholder="Enter recipient email"
              required
            />
          </div>

          <div>
            <label for="count">Number of Questions</label>

            <select id="count">
              <option>10</option>
              <option>20</option>
              <option selected>30</option>
              <option>40</option>
              <option>50</option>
            </select>
          </div>

          <div>
            <label for="folder">Google Drive Folder Name</label>

            <input
              id="folder"
              type="text"
              value="All Generated Quizzes"
              required
            />
          </div>

          <div>
            <label for="mode">Execution Mode</label>

            <select id="mode">
              <option value="live" selected>Live CrewAI Endpoint</option>
              <option value="demo">Demo Preview</option>
            </select>
          </div>

        </div>

        <div class="actions">

          <button
            class="primary"
            id="runBtn"
            type="submit"
          >
            Run Workflow
          </button>

          <button
            class="secondary"
            id="clearBtn"
            type="button"
          >
            Clear
          </button>

        </div>

      </form>

      <div id="status" class="status"></div>

    </section>

    <section class="card">

      <h2>Result</h2>

      <div id="result" class="result">
        No run yet.
      </div>

    </section>

  </div>

  <script>

    const form = document.getElementById("quizForm");

    const statusBox = document.getElementById("status");

    const resultBox = document.getElementById("result");

    const runBtn = document.getElementById("runBtn");


    function showStatus(message, type = "") {

      statusBox.textContent = message;

      statusBox.className = "status " + type;

      statusBox.style.display = "block";

    }


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const pdfLink =
        document.getElementById("pdfLink").value.trim();

      const quizTitle =
        document.getElementById("title").value.trim();

      const recipientName =
        document.getElementById("recipientName").value.trim();

      const recipientEmail =
        document.getElementById("recipient").value.trim();

      const questionCount =
        Number(document.getElementById("count").value);

      const driveFolder =
        document.getElementById("folder").value.trim();

      const mode =
        document.getElementById("mode").value;


      // Accept Google Drive links.
      // The link does not need to end with .pdf.

      if (!pdfLink.includes("drive.google.com")) {

        showStatus(
          "Please enter a valid Google Drive PDF link.",
          "error"
        );

        return;

      }


      const data = {

        quiz_title: quizTitle,

        recipient_name: recipientName,

        recipient_email: recipientEmail,

        question_count: questionCount,

        drive_folder: driveFolder,

        pdf_link: pdfLink

      };


      runBtn.disabled = true;

      showStatus("Preparing workflow...");

      resultBox.textContent = "Working...";


      try {

        if (mode === "demo") {

          resultBox.textContent = JSON.stringify({

            mode: "demo",

            quiz_title: data.quiz_title,

            recipient_name: data.recipient_name,

            recipient_email: data.recipient_email,

            question_count: data.question_count,

            drive_folder: data.drive_folder,

            message:
              "Demo preview only. No real CrewAI workflow was executed."

          }, null, 2);

          showStatus(
            "Demo preview completed.",
            "ok"
          );

          return;

        }


        const payload = {

          recipient_email: data.recipient_email,

          recipient_name: data.recipient_name,

          pdf_link: data.pdf_link,

          quiz_title: data.quiz_title,

          question_count: data.question_count,

          drive_folder: data.drive_folder,

          instruction:
            "Generate questions with four options and correct answers. Save the complete quiz in Google Drive. Create an email draft only. Do not send the email."

        };


        const response = await fetch("/api/generate", {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify(payload)

        });


        const body = await response.json().catch(() => ({

          message: "Invalid server response"

        }));


        if (!response.ok) {

          throw new Error(

            body.error ||
            body.message ||
            "Workflow request failed"

          );

        }


        resultBox.textContent =
          JSON.stringify(body, null, 2);


        showStatus(

          "Workflow completed. Check Google Drive and email drafts.",

          "ok"

        );


      } catch (error) {

        resultBox.textContent = error.message;

        showStatus(error.message, "error");

      } finally {

        runBtn.disabled = false;

      }

    });


    document.getElementById("clearBtn").addEventListener(
      "click",
      () => {

        form.reset();

        document.getElementById("folder").value =
          "All Generated Quizzes";

        resultBox.textContent = "No run yet.";

        statusBox.style.display = "none";

      }
    );

  </script>

</body>
</html>
