<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quiz Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #334155;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #6366f1;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .mode-box {
      margin-top: 20px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 8px;
    }

    .mode-box label {
      margin-top: 0;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      display: block !important;
      background: #e0e7ff;
      color: #3730a3;
    }

    .demo {
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      display: none;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AI Quiz Generator</h1>

  <p class="subtitle">
    Generate a quiz from your study material using CrewAI
  </p>

  <form id="quizForm">

    <label for="recipientName">Recipient Name</label>
    <input
      type="text"
      id="recipientName"
      placeholder="Enter recipient name"
      required
    >

    <label for="recipientEmail">Recipient Email</label>
    <input
      type="email"
      id="recipientEmail"
      placeholder="Enter email address"
      required
    >

    <label for="pdfLink">Google Drive PDF Link</label>
    <input
      type="url"
      id="pdfLink"
      placeholder="https://drive.google.com/..."
      required
    >

    <label for="quizTitle">Quiz Title</label>
    <input
      type="text"
      id="quizTitle"
      placeholder="Enter quiz title"
      required
    >

    <label for="questionCount">Number of Questions</label>
    <select id="questionCount">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>

    <label for="driveFolder">Google Drive Folder</label>
    <input
      type="text"
      id="driveFolder"
      value="All Generated Quizzes"
    >

    <div class="mode-box">
      <label for="mode">Execution Mode</label>

      <select id="mode">
        <option value="live" selected>
          Live CrewAI Endpoint
        </option>

        <option value="demo">
          Demo Preview
        </option>
      </select>
    </div>

    <button type="submit">
      Generate Quiz
    </button>

  </form>

  <div id="status"></div>

  <div id="demoBox" class="demo">
    <strong>Demo Preview</strong>
    <pre id="demoOutput"></pre>
  </div>

</div>

<script>

const form = document.getElementById("quizForm");
const statusBox = document.getElementById("status");
const demoBox = document.getElementById("demoBox");
const demoOutput = document.getElementById("demoOutput");

function showStatus(message, type) {
  statusBox.className = type;
  statusBox.textContent = message;
}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  demoBox.style.display = "none";
  statusBox.className = "";
  statusBox.style.display = "none";

  const recipientName =
    document.getElementById("recipientName").value.trim();

  const recipientEmail =
    document.getElementById("recipientEmail").value.trim();

  const pdfLink =
    document.getElementById("pdfLink").value.trim();

  const quizTitle =
    document.getElementById("quizTitle").value.trim();

  const questionCount =
    document.getElementById("questionCount").value;

  const driveFolder =
    document.getElementById("driveFolder").value.trim();

  const mode =
    document.getElementById("mode").value;

  const payload = {

    recipient_email: recipientEmail,

    recipient_name: recipientName,

    pdf_link: pdfLink,

    quiz_title: quizTitle,

    question_count: questionCount,

    drive_folder: driveFolder,

    instruction:
      "Generate questions with four options and correct answers. Save the complete quiz in Google Drive. Create an email draft only. Do not send the email."

  };

  // DEMO MODE

  if (mode === "demo") {

    demoBox.style.display = "block";

    demoOutput.textContent =
      JSON.stringify(payload, null, 2);

    showStatus(
      "Demo preview generated successfully.",
      "success"
    );

    return;
  }

  // LIVE NETLIFY FUNCTION

  showStatus(
    "Generating quiz... Please wait.",
    "loading"
  );

  try {

    const response = await fetch(
      "/.netlify/functions/generate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(payload)
      }
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = {
        raw: text
      };
    }

    if (!response.ok) {

      showStatus(
        "Workflow request failed.\n\n" +
        JSON.stringify(data, null, 2),
        "error"
      );

      return;
    }

    showStatus(
      "Quiz workflow completed successfully!\n\n" +
      JSON.stringify(data, null, 2),
      "success"
    );

  } catch (error) {

    showStatus(
      "Connection error:\n\n" +
      error.message,
      "error"
    );

  }

});

</script>

</body>
</html>
